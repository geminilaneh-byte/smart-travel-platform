name: Build Med Reminder APK
on:
  push:
    branches: [ med-reminder-build ]
    paths: [ 'med-reminder/**', '.github/workflows/build-med-reminder-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: med-reminder
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: med-reminder-apk
          path: med-reminder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
