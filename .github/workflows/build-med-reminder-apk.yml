name: Build Med Reminder Release
on:
  push:
    branches: [ med-reminder-build ]
    paths:
      - 'med-reminder/**'
      - '.github/workflows/build-med-reminder-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK and AAB
        working-directory: med-reminder
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p release-out
          cp med-reminder/app/build/outputs/apk/release/app-release-unsigned.apk release-out/
          cp med-reminder/app/build/outputs/bundle/release/app-release.aab release-out/app-release-unsigned.aab
          sha256sum release-out/* > release-out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: med-reminder-release-unsigned
          path: release-out/
          if-no-files-found: error
          retention-days: 7
