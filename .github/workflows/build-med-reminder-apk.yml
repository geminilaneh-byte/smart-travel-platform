name: Build Med Reminder Installable APK
on:
  push:
    branches: [ med-reminder-build ]
    paths:
      - 'med-reminder/**'
      - '.github/workflows/build-med-reminder-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: med-reminder
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign APK with Android signing schemes
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass BaniBuild2026 -keypass BaniBuild2026 -alias medrelease -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=BANI Med Reminder, OU=BANI Apps, O=BANI, C=NL"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias medrelease --ks-pass pass:BaniBuild2026 --key-pass pass:BaniBuild2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out BANI-Med-Reminder-v1.0-installable.apk med-reminder/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs BANI-Med-Reminder-v1.0-installable.apk
          sha256sum BANI-Med-Reminder-v1.0-installable.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: med-reminder-installable-release
          path: |
            BANI-Med-Reminder-v1.0-installable.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
